<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💻 代码生成专项</title>
<style>

:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;--orange:#d29922;--red:#f85149;--purple:#bc8cff;--pink:#f778ba;--cyan:#39d2c0;--yellow:#e3b341}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.75}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.nav a{color:var(--accent);font-size:.9rem}.nav span{color:var(--text2);font-size:.85rem}
.hero{text-align:center;padding:48px 20px 32px;background:linear-gradient(135deg,var(--bg) 0%,var(--surface) 50%,#1a1525 100%);border-bottom:1px solid var(--border)}
.hero h1{font-size:2.4em;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.hero .subtitle{color:var(--text2);font-size:1.1em;max-width:600px;margin:0 auto 20px}
.badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.82em;font-weight:600}
.badge-blue{background:rgba(88,166,255,.15);color:var(--accent);border:1px solid rgba(88,166,255,.3)}
.badge-green{background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.badge-orange{background:rgba(210,153,34,.15);color:var(--orange);border:1px solid rgba(210,153,34,.3)}
.badge-purple{background:rgba(188,140,255,.15);color:var(--purple);border:1px solid rgba(188,140,255,.3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;max-width:800px;margin:30px auto 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;transition:border-color .2s}
.stat:hover{border-color:var(--accent)}
.stat .val{color:var(--accent);font-size:1.8em;font-weight:700}
.stat .lbl{color:var(--text2);font-size:.82em;margin-top:4px}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
.section-title{color:var(--accent);font-size:1.5em;margin:40px 0 16px;border-left:4px solid var(--accent);padding-left:12px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:20px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;transition:transform .2s,border-color .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .card-num{font-size:.75em;font-weight:700;color:var(--accent);background:rgba(88,166,255,.1);padding:3px 10px;border-radius:8px;display:inline-block;margin-bottom:8px}
.card .card-title{color:#f0f6fc;font-size:1.05em;font-weight:600;margin-bottom:8px}
.card .card-topics{list-style:none;padding:0;margin:8px 0}
.card .card-topics li{padding:3px 0;font-size:.88em;color:var(--text2)}
.card .card-topics li::before{content:"▸ ";color:var(--accent)}
.card .card-meta{display:flex;justify-content:space-between;align-items:center;font-size:.82em;color:var(--text2);border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.card .difficulty{color:var(--orange)}
.card .duration{color:var(--text2)}
.tip{background:rgba(63,185,80,.08);border-left:4px solid var(--green);padding:12px 16px;margin:15px 0;border-radius:0 8px 8px 0}
.warn{background:#2d1b00;border-left:4px solid var(--orange);padding:12px 16px;margin:15px 0;border-radius:0 8px 8px 0}
.deep{background:#1a1024;border-left:4px solid var(--purple);padding:12px 16px;margin:15px 0;border-radius:0 8px 8px 0}
.highlight{background:#1a2332;border-left:4px solid var(--accent);padding:12px 16px;margin:15px 0;border-radius:0 8px 8px 0}
.ascii-art{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin:15px 0;font-family:monospace;font-size:.85em;line-height:1.4;white-space:pre;overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:15px 0;font-size:.9em}
th{background:var(--surface);color:var(--accent);padding:10px 12px;text-align:left;border:1px solid var(--border);font-weight:600}
td{padding:8px 12px;border:1px solid var(--border)}
tr:nth-child(even){background:rgba(22,27,34,.5)}
tr:hover{background:var(--surface)}
code{background:var(--surface);padding:2px 6px;border-radius:4px;font-size:.9em;color:var(--accent)}
pre{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto;margin:15px 0;font-size:.9em;line-height:1.6}
pre code{background:none;padding:0}
ul,ol{margin:10px 0 10px 25px}li{margin:5px 0}
.footer{text-align:center;padding:40px 20px;color:var(--text2);font-size:.85em;border-top:1px solid var(--border);margin-top:50px}
@media(max-width:600px){
  .cards-grid{grid-template-columns:1fr}
  .hero h1{font-size:1.8em}
  .stats{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>
<body>


<div class="hero">
<h1>💻 代码生成专项</h1>
<p class="subtitle"></p>
<div class="badges">
<span class="badge badge-blue">6 模块</span>
<span class="badge badge-green">系统学习</span>
<span class="badge badge-purple">深度指南</span>
</div>
<div class="stats">
  <div class="stat"><div class="val">6</div><div class="lbl">核心模块</div></div>
  <div class="stat"><div class="val">~12h</div><div class="lbl">预计学时</div></div>
  <div class="stat"><div class="val">进阶</div><div class="lbl">难度等级</div></div>
</div>
</div>

<div class="container">

<h2 class="section-title">📖 课程模块</h2>
<div class="cards-grid">
<a class="card" href="#" style="text-decoration:none;color:inherit">

  <ul class="card-topics"><li></li></ul>
  <div class="card-meta"><span class="duration"></span></div>
</a>
<a class="card" href="#" style="text-decoration:none;color:inherit">
  <span class="card-num">02 训练方法</span>
  <div class="card-title">FIM、数据工程、长上下文</div>
  <ul class="card-topics"><li></li></ul>
  <div class="card-meta"><span class="duration"></span></div>
</a>
<a class="card" href="#" style="text-decoration:none;color:inherit">
  <span class="card-num">03 Repo-level</span>
  <div class="card-title">代码图、跨文件推理、代码 RAG</div>
  <ul class="card-topics"><li></li></ul>
  <div class="card-meta"><span class="duration"></span></div>
</a>
<a class="card" href="#" style="text-decoration:none;color:inherit">
  <span class="card-num">04 评测体系</span>
  <div class="card-title">HumanEval、SWE-bench、LiveCodeBench</div>
  <ul class="card-topics"><li></li></ul>
  <div class="card-meta"><span class="duration"></span></div>
</a>
<a class="card" href="#" style="text-decoration:none;color:inherit">
  <span class="card-num">05 代码修复</span>
  <div class="card-title">Agentless、SWE-agent、OpenHands</div>
  <ul class="card-topics"><li></li></ul>
  <div class="card-meta"><span class="duration"></span></div>
</a>
<a class="card" href="#" style="text-decoration:none;color:inherit">
  <span class="card-num">06 前沿方向</span>
  <div class="card-title">长上下文、多文件编辑、安全</div>
  <ul class="card-topics"><li></li></ul>
  <div class="card-meta"><span class="duration"></span></div>
</a>

</div>

</div>

</div>

</body>
</html>
